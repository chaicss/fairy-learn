<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>เก่งไทย เก่งอังกฤษ 🦉</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  /* ---- rainbow–purple candy palette ---- */
  --grape:#A855F7;  --grape-d:#7C3AED;  --grape-l:#F3E8FF;
  --green:#3DD68C;  --green-d:#1FB874;  --green-l:#D9FBEC;
  --blue:#3FBDF8;   --blue-d:#1195D6;   --blue-l:#DFF4FF;
  --red:#FF5E7A;    --red-d:#E23A5C;    --red-l:#FFE2E8;
  --gold:#FFC53D;   --gold-d:#E9A100;   --gold-l:#FFF3D2;
  --purple:#C084FC; --purple-d:#9333EA;
  --orange:#FF9A3C; --orange-d:#E5761A;
  --pink:#FF7BC5;   --pink-d:#E5479F;
  --teal:#2BD9C4;   --teal-d:#0FB3A0;
  --indigo:#8B7BF5; --indigo-d:#6353DF;

  /* ---- gradients ---- */
  --g-grape:linear-gradient(135deg,#C084FC,#8B5CF6);
  --g-green:linear-gradient(135deg,#6EE7B7,#22C55E);
  --g-blue:linear-gradient(135deg,#7DD3FC,#0EA5E9);
  --g-red:linear-gradient(135deg,#FDA4AF,#F43F5E);
  --g-gold:linear-gradient(135deg,#FDE68A,#F59E0B);
  --g-purple:linear-gradient(135deg,#D8B4FE,#A855F7);
  --g-orange:linear-gradient(135deg,#FDBA74,#F97316);
  --g-pink:linear-gradient(135deg,#FBCFE8,#EC4899);
  --g-teal:linear-gradient(135deg,#7DEBDC,#14B8A6);
  --g-indigo:linear-gradient(135deg,#C7BFFF,#7C6BF0);
  --g-rainbow:linear-gradient(100deg,#FF7BC5,#C084FC,#7DD3FC,#6EE7B7,#FDE68A);

  --ink:#3D2C5E; --ink-2:#5B4A80; --grey:#9C8FBC; --grey-l:#E7DFF7; --grey-bg:#F7F2FF;
  --card:#FFFFFF;
  --shadow:0 10px 24px -12px rgba(96,52,170,.42);
  --wrap:600px;
}
html,body{height:100%;}
body{
  font-family:'Baloo 2','Nunito',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  color:var(--ink);overflow-x:hidden;-webkit-font-smoothing:antialiased;
  background:
    radial-gradient(900px 620px at 6% -8%, #EBDBFF 0%, transparent 58%),
    radial-gradient(880px 620px at 110% 0%, #FFDAF1 0%, transparent 55%),
    radial-gradient(760px 560px at -10% 60%, #D8F1FF 0%, transparent 55%),
    radial-gradient(980px 720px at 60% 118%, #DEFBEC 0%, transparent 58%),
    linear-gradient(165deg,#F9F4FF 0%,#F3EBFF 50%,#FDFAFF 100%);
  background-attachment:fixed;
}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit;}

/* ---- floating background decorations ---- */
#deco{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
#deco .blob{
  position:absolute;border-radius:46% 54% 52% 48%/48% 46% 54% 52%;opacity:.5;
  box-shadow:inset 0 -12px 20px rgba(0,0,0,.07),inset 0 10px 16px rgba(255,255,255,.6);
  animation:floaty 13s ease-in-out infinite;
}
#deco .spark{position:absolute;font-size:16px;opacity:.3;animation:floaty 9s ease-in-out infinite;}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-22px) rotate(9deg)}}

/* ============ clay buttons ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-weight:800;font-size:18px;letter-spacing:.4px;
  border-radius:20px;padding:15px 20px;width:100%;color:#fff;
  background:var(--g-grape);
  box-shadow:0 6px 0 var(--grape-d),0 14px 22px -10px rgba(124,58,237,.55),
             inset 0 -4px 7px rgba(0,0,0,.14),inset 0 4px 7px rgba(255,255,255,.45);
  transition:transform .08s,box-shadow .08s,filter .15s;user-select:none;
  text-shadow:0 1px 0 rgba(0,0,0,.12);
}
.btn:active:not(:disabled){transform:translateY(6px);
  box-shadow:0 0 0 var(--grape-d),inset 0 -2px 5px rgba(0,0,0,.14),inset 0 3px 6px rgba(255,255,255,.4);}
.btn:disabled{background:#E7DFF7;color:#B6A8D6;box-shadow:0 4px 0 #D6C9EE;cursor:default;text-shadow:none;}
.btn.green{background:var(--g-green);box-shadow:0 6px 0 var(--green-d),0 14px 22px -10px rgba(34,197,94,.5),inset 0 -4px 7px rgba(0,0,0,.13),inset 0 4px 7px rgba(255,255,255,.5);}
.btn.green:active{box-shadow:0 0 0 var(--green-d);}
.btn.blue{background:var(--g-blue);box-shadow:0 6px 0 var(--blue-d),0 14px 22px -10px rgba(14,165,233,.5),inset 0 -4px 7px rgba(0,0,0,.13),inset 0 4px 7px rgba(255,255,255,.5);}
.btn.blue:active{box-shadow:0 0 0 var(--blue-d);}
.btn.red{background:var(--g-red);box-shadow:0 6px 0 var(--red-d),0 14px 22px -10px rgba(244,63,94,.5),inset 0 -4px 7px rgba(0,0,0,.13),inset 0 4px 7px rgba(255,255,255,.45);}
.btn.red:active{box-shadow:0 0 0 var(--red-d);}
.btn.ghost{background:#fff;color:var(--grape-d);box-shadow:0 5px 0 var(--grey-l),inset 0 0 0 2px var(--grey-l);text-shadow:none;}
.btn.ghost:active{box-shadow:0 0 0 var(--grey-l),inset 0 0 0 2px var(--grey-l);}

/* ============ Shell ============ */
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 16px;position:relative;z-index:1;}
.screen{display:none;}
.screen.on{display:block;}

/* ============ Top bar ============ */
#topbar{position:sticky;top:0;z-index:40;
  background:rgba(255,255,255,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:2px solid rgba(168,85,247,.14);}
.stats{max-width:var(--wrap);margin:0 auto;padding:11px 14px;display:flex;align-items:center;gap:8px;}
.stat{display:flex;align-items:center;gap:5px;font-weight:800;font-size:17px;
  background:#fff;border-radius:999px;padding:5px 12px 5px 8px;
  box-shadow:0 3px 0 rgba(124,58,237,.13),0 6px 14px -8px rgba(124,58,237,.45);}
.stat .ic{font-size:19px;line-height:1;}
.stat.fire{color:var(--orange-d);} .stat.xp{color:var(--gold-d);} .stat.heart{color:var(--red-d);}
.stat.dim{opacity:.5;}
.goalring{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--grape-d);}
.ring{width:36px;height:36px;transform:rotate(-90deg);}
.ring circle{fill:none;stroke-width:6;stroke-linecap:round;}
.ring .bg{stroke:var(--grey-l);}
.ring .fg{stroke:url(#ringgrad);transition:stroke-dasharray .5s;}

/* ============ Path ============ */
#path{padding:14px 0 120px;}
.hero{
  display:flex;align-items:center;gap:14px;background:#fff;border-radius:26px;padding:16px 18px;
  box-shadow:var(--shadow);margin-bottom:10px;position:relative;overflow:hidden;
}
.hero::after{content:'';position:absolute;inset:0;background:var(--g-rainbow);opacity:.11;pointer-events:none;}
.hero .owl{font-size:46px;animation:floaty 6s ease-in-out infinite;position:relative;z-index:1;}
.hero .ht{font-size:19px;font-weight:800;position:relative;z-index:1;}
.hero .hs{font-size:13px;font-weight:700;color:var(--grey);position:relative;z-index:1;line-height:1.5;}

.unit-head{
  border-radius:24px;padding:16px 18px;margin:26px 0 6px;color:#fff;position:relative;overflow:hidden;
  display:flex;align-items:center;gap:13px;
  box-shadow:0 7px 0 rgba(0,0,0,.13),0 16px 26px -12px rgba(96,52,170,.5),
             inset 0 -5px 9px rgba(0,0,0,.13),inset 0 5px 9px rgba(255,255,255,.35);
}
.unit-head::after{content:'';position:absolute;right:-24px;top:-30px;width:110px;height:110px;
  border-radius:50%;background:rgba(255,255,255,.16);}
.unit-head .uh-ic{font-size:34px;position:relative;z-index:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.25));}
.unit-head .uh-t{font-size:12px;font-weight:700;opacity:.9;letter-spacing:.6px;position:relative;z-index:1;}
.unit-head .uh-n{font-size:21px;font-weight:800;line-height:1.25;position:relative;z-index:1;text-shadow:0 2px 3px rgba(0,0,0,.18);}
.nodes{display:flex;flex-direction:column;align-items:center;gap:0;padding:8px 0 4px;}
.noderow{display:flex;justify-content:center;width:100%;margin-bottom:12px;}
.node{
  position:relative;width:80px;height:72px;border-radius:50%;
  background:#E7DFF7;
  box-shadow:0 8px 0 #CFC0EC,0 16px 22px -12px rgba(96,52,170,.6),
             inset 0 -6px 10px rgba(0,0,0,.16),inset 0 6px 10px rgba(255,255,255,.5);
  display:flex;align-items:center;justify-content:center;font-size:33px;
  transition:transform .1s,box-shadow .1s,filter .15s;margin:8px 0;
  filter:drop-shadow(0 0 0 transparent);
}
.node:active{transform:translateY(7px);}
.node.lock{opacity:.7;}
.node.cur{animation:pulse 2.2s ease-in-out infinite;}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.node .crowns{
  position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);
  background:#fff;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:800;
  color:var(--gold-d);white-space:nowrap;box-shadow:0 3px 8px -2px rgba(96,52,170,.5);
}
.nlabel{font-size:13px;font-weight:800;color:var(--ink-2);text-align:center;max-width:140px;margin-top:14px;line-height:1.3;}
.startpop{
  position:absolute;top:0;left:50%;transform:translateX(-50%);
  background:#fff;border-radius:999px;padding:8px 16px;
  font-size:13px;font-weight:800;color:var(--grape-d);white-space:nowrap;z-index:5;
  animation:bob 1.5s ease-in-out infinite;box-shadow:0 4px 0 var(--grey-l),0 10px 18px -8px rgba(124,58,237,.6);
}
@keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-7px)}}

/* ============ Bottom nav ============ */
#nav{position:fixed;bottom:0;left:0;right:0;z-index:40;
  background:rgba(255,255,255,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:2px solid rgba(168,85,247,.14);padding-bottom:env(safe-area-inset-bottom);}
.navin{max-width:var(--wrap);margin:0 auto;display:flex;padding:6px 8px;gap:6px;}
.navb{flex:1;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;
  font-size:11px;font-weight:800;color:var(--grey);border-radius:18px;transition:all .15s;}
.navb .ic{font-size:25px;transition:transform .15s;}
.navb.on{color:#fff;background:var(--g-grape);box-shadow:0 4px 0 var(--grape-d),0 10px 18px -9px rgba(124,58,237,.7);}
.navb.on .ic{transform:scale(1.12);}

/* ============ Lesson ============ */
#lesson{position:fixed;inset:0;z-index:60;display:none;flex-direction:column;
  background:linear-gradient(170deg,#FBF7FF 0%,#F5EEFF 55%,#FDFBFF 100%);}
#lesson.on{display:flex;}
.lhead{padding:14px 16px 4px;display:flex;align-items:center;gap:12px;max-width:var(--wrap);margin:0 auto;width:100%;}
.xbtn{font-size:26px;color:var(--grey);font-weight:800;line-height:1;padding:2px 8px;}
.pbar{flex:1;height:18px;border-radius:999px;background:var(--grey-l);overflow:hidden;position:relative;
  box-shadow:inset 0 2px 4px rgba(96,52,170,.14);}
.pbar i{display:block;height:100%;background:var(--g-rainbow);border-radius:999px;
  transition:width .4s cubic-bezier(.2,.8,.3,1);position:relative;}
.pbar i::after{content:'';position:absolute;top:3px;left:8px;right:8px;height:5px;border-radius:5px;background:rgba(255,255,255,.45);}
.hearts{display:flex;align-items:center;gap:3px;font-weight:800;color:var(--red-d);font-size:17px;}
.combo{max-width:var(--wrap);margin:0 auto;width:100%;padding:0 16px;height:24px;
  font-size:13px;font-weight:800;color:var(--orange-d);text-align:center;}
.lbody{flex:1;overflow-y:auto;padding:10px 16px 200px;}
.lbody-in{max-width:var(--wrap);margin:0 auto;}
.qtitle{font-size:24px;font-weight:800;margin:10px 0 18px;line-height:1.4;}
.qsub{font-size:14px;color:var(--grey);font-weight:700;margin:-10px 0 16px;line-height:1.5;}

.prompt{display:flex;align-items:center;gap:14px;margin-bottom:22px;}
.speaker{
  flex:none;width:66px;height:66px;border-radius:22px;background:var(--g-blue);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:30px;
  box-shadow:0 6px 0 var(--blue-d),0 14px 20px -10px rgba(14,165,233,.65),
             inset 0 -4px 7px rgba(0,0,0,.14),inset 0 4px 7px rgba(255,255,255,.45);
  transition:transform .08s,box-shadow .08s;
}
.speaker:active{transform:translateY(6px);box-shadow:0 0 0 var(--blue-d);}
.speaker.sm{width:50px;height:50px;font-size:23px;border-radius:17px;}
.bubble{
  position:relative;background:#fff;border-radius:20px;padding:14px 18px;
  font-size:21px;font-weight:700;line-height:1.55;flex:1;box-shadow:var(--shadow);
}
.bubble::before{content:'';position:absolute;left:-8px;top:24px;width:16px;height:16px;
  background:#fff;transform:rotate(45deg);border-radius:3px;}
.bigword{font-size:46px;font-weight:800;text-align:center;margin:6px 0 20px;letter-spacing:1px;}
.bigemo{font-size:88px;text-align:center;margin:4px 0 18px;line-height:1;
  filter:drop-shadow(0 10px 14px rgba(96,52,170,.28));animation:pop .4s cubic-bezier(.34,1.56,.5,1);}
@keyframes pop{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}

/* option list */
.opts{display:flex;flex-direction:column;gap:12px;}
.opt{
  display:flex;align-items:center;gap:12px;text-align:left;width:100%;background:#fff;
  border-radius:20px;padding:15px 16px;font-size:19px;font-weight:700;
  box-shadow:0 5px 0 var(--grey-l),0 10px 18px -12px rgba(96,52,170,.5);
  transition:transform .08s,box-shadow .1s,background .12s,color .12s;
}
.opt:active{transform:translateY(4px);box-shadow:0 1px 0 var(--grey-l);}
.opt .key{
  flex:none;width:28px;height:28px;border-radius:9px;background:var(--grey-bg);
  font-size:12px;font-weight:800;color:var(--grape-d);display:flex;align-items:center;justify-content:center;
}
.opt.sel{background:var(--grape-l);color:var(--grape-d);box-shadow:0 5px 0 var(--purple-d),0 10px 18px -10px rgba(147,51,234,.7);}
.opt.sel .key{background:#fff;}
.opt.good{background:var(--green-l);color:var(--green-d);box-shadow:0 5px 0 var(--green-d);}
.opt.good .key{background:#fff;color:var(--green-d);}
.opt.bad{background:var(--red-l);color:var(--red-d);box-shadow:0 5px 0 var(--red-d);}
.opt.bad .key{background:#fff;color:var(--red-d);}
.opt.dim{opacity:.4;}

/* emoji grid */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.card{
  background:#fff;border-radius:22px;padding:16px 10px 13px;
  display:flex;flex-direction:column;align-items:center;gap:8px;
  box-shadow:0 5px 0 var(--grey-l),0 12px 20px -12px rgba(96,52,170,.5);
  transition:transform .08s,box-shadow .1s,background .12s;
}
.card:active{transform:translateY(4px);box-shadow:0 1px 0 var(--grey-l);}
.card .e{font-size:56px;line-height:1;filter:drop-shadow(0 6px 8px rgba(96,52,170,.22));}
.card .t{font-size:17px;font-weight:800;}
.card.sel{background:var(--grape-l);color:var(--grape-d);box-shadow:0 5px 0 var(--purple-d);}
.card.good{background:var(--green-l);color:var(--green-d);box-shadow:0 5px 0 var(--green-d);}
.card.bad{background:var(--red-l);color:var(--red-d);box-shadow:0 5px 0 var(--red-d);}

/* match */
.matchcols{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.mtile{
  background:#fff;border-radius:18px;padding:15px 8px;font-size:18px;font-weight:700;text-align:center;
  min-height:58px;display:flex;align-items:center;justify-content:center;line-height:1.35;
  box-shadow:0 5px 0 var(--grey-l),0 10px 16px -12px rgba(96,52,170,.5);transition:all .12s;
}
.mtile:active{transform:translateY(4px);box-shadow:0 1px 0 var(--grey-l);}
.mtile.sel{background:var(--grape-l);color:var(--grape-d);box-shadow:0 5px 0 var(--purple-d);}
.mtile.ok{background:var(--green-l);color:var(--green-d);box-shadow:0 3px 0 var(--green-d);opacity:.5;pointer-events:none;}
.mtile.err{background:var(--red-l);color:var(--red-d);box-shadow:0 5px 0 var(--red-d);animation:shake .35s;}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

/* build */
.answerline{
  min-height:112px;background:rgba(255,255,255,.6);border-radius:20px;
  box-shadow:inset 0 2px 8px rgba(96,52,170,.12);
  padding:12px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:9px;margin-bottom:22px;
}
.bank{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;}
.chip{
  background:#fff;border-radius:14px;padding:10px 15px;font-size:18px;font-weight:700;
  box-shadow:0 4px 0 var(--grey-l),0 8px 14px -10px rgba(96,52,170,.5);transition:transform .08s,box-shadow .08s;
}
.chip:active{transform:translateY(3px);box-shadow:0 1px 0 var(--grey-l);}
.chip.used{opacity:0;pointer-events:none;}
.chip.done{background:var(--grape-l);color:var(--grape-d);box-shadow:0 4px 0 var(--purple-d);}
.chip.wrong{background:var(--red-l);color:var(--red-d);box-shadow:0 4px 0 var(--red-d);animation:shake .35s;}
.chip.hint{box-shadow:0 4px 0 var(--gold-d),0 0 0 5px rgba(255,197,61,.45);animation:hintbob 1s ease-in-out infinite;}
@keyframes hintbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.slot{height:46px;border-radius:14px;background:rgba(168,85,247,.08);
  box-shadow:inset 0 0 0 2px rgba(168,85,247,.18);}
.slot.next{box-shadow:inset 0 0 0 3px var(--purple);animation:blink 1.3s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}

/* passage */
.passage{
  background:#fff;border-radius:22px;padding:18px;margin-bottom:22px;
  font-size:18px;line-height:2;font-weight:600;box-shadow:var(--shadow);
  position:relative;overflow:hidden;
}
.passage::before{content:'';position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--g-rainbow);}
.passage h4{font-size:21px;margin-bottom:8px;color:var(--grape-d);}

/* footer */
.lfoot{
  position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.95);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:2px solid rgba(168,85,247,.14);
  padding:14px 16px calc(16px + env(safe-area-inset-bottom));transition:background .2s;
  border-radius:26px 26px 0 0;box-shadow:0 -8px 24px -14px rgba(96,52,170,.5);
}
.lfoot-in{max-width:var(--wrap);margin:0 auto;}
.lfoot.good{background:var(--green-l);}
.lfoot.bad{background:var(--red-l);}
.fb{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px;}
.fb .fi{font-size:32px;line-height:1;}
.fb .ft{font-weight:800;font-size:19px;}
.fb .fs{font-weight:700;font-size:15px;opacity:.92;margin-top:2px;line-height:1.5;}
.lfoot.good .fb{color:var(--green-d);} .lfoot.bad .fb{color:var(--red-d);}

/* ============ Result ============ */
#result{position:fixed;inset:0;z-index:70;display:none;flex-direction:column;
  align-items:center;justify-content:center;padding:24px;text-align:center;
  background:
    radial-gradient(700px 500px at 50% 8%, #F3E8FF 0%, transparent 60%),
    linear-gradient(170deg,#FBF7FF,#F3EBFF 60%,#FFF5FC);}
#result.on{display:flex;}
.rtitle{font-size:34px;font-weight:800;margin:14px 0 6px;
  background:var(--g-rainbow);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:saturate(1.35) brightness(.9);}
.rsub{font-size:16px;font-weight:700;color:var(--grey);margin-bottom:26px;}
.rcards{display:flex;gap:12px;width:100%;max-width:420px;margin-bottom:30px;}
.rcard{flex:1;border-radius:20px;padding:3px;background:var(--g-gold);box-shadow:0 8px 18px -10px rgba(96,52,170,.6);}
.rcard.b{background:var(--g-blue);} .rcard.g{background:var(--g-green);}
.rcard .in{background:#fff;border-radius:17px;padding:9px 6px;}
.rcard .lab{font-size:11px;font-weight:800;color:var(--gold-d);letter-spacing:.5px;}
.rcard.b .lab{color:var(--blue-d);} .rcard.g .lab{color:var(--green-d);}

<script>
/* =====================================================================
   1. STORAGE  (localStorage ถ้าใช้ได้ ไม่งั้นเก็บในหน่วยความจำ)
   ===================================================================== */
const MEM = {};
const store = {
  get(k, d){
    try{ const v = localStorage.getItem('duokid_'+k); if(v!==null) return JSON.parse(v); }
    catch(e){}
    return (k in MEM) ? MEM[k] : d;
  },
  set(k, v){
    MEM[k] = v;
    try{ localStorage.setItem('duokid_'+k, JSON.stringify(v)); }catch(e){}
  }
};

/* =====================================================================
   2. SOUND — TTS ไทย/อังกฤษ + เอฟเฟกต์
   ===================================================================== */
const hasTTS = ('speechSynthesis' in window) && ('SpeechSynthesisUtterance' in window);
let thVoice=null, enVoice=null, voicesReady=false;
function loadVoices(){
  if(!hasTTS) return;
  const vs = speechSynthesis.getVoices(); if(!vs || !vs.length) return;
  voicesReady = true;
  const pick=(list,prefs)=>{ for(const re of prefs){ const v=list.find(v=>re.test(v.name)); if(v) return v; } return list[0]||null; };
  const th = vs.filter(v=>/^th/i.test(v.lang));
  const en = vs.filter(v=>/^en[-_]?US/i.test(v.lang)).concat(vs.filter(v=>/^en/i.test(v.lang)));
  thVoice = pick(th,[/google/i,/kanya|narisa|premwadee|pattara/i]);
  enVoice = pick(en,[/google us english/i,/google/i,/samantha|ava|allison|zoe/i]);
}
if(hasTTS){ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; setTimeout(loadVoices,400); setTimeout(loadVoices,1400); }
const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);

let audioEl=null, audioQ=[];
function ttsURL(t,l){ return 'https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl='+(l.startsWith('th')?'th':'en')+'&q='+encodeURIComponent(t); }
function stopAudio(){ if(audioEl){ try{ audioEl.onended=null; audioEl.onerror=null; audioEl.pause(); }catch(e){} } audioQ=[]; }
function audioSay(p){ stopAudio(); audioQ=p.slice(); nextAudio(); }
function nextAudio(){ if(!audioQ.length) return; const [t,l]=audioQ.shift();
  audioEl=new Audio(ttsURL(t,l)); audioEl.onended=nextAudio; const pr=audioEl.play(); if(pr&&pr.catch) pr.catch(()=>{}); }
let lastSay=0;
function say(pairs){
  const now = performance.now?performance.now():Date.now();
  if(now-lastSay < 150) return; lastSay=now;
  loadVoices(); stopAudio();
  const ok = hasTTS && voicesReady && pairs.every(([t,l])=> l.startsWith('th')?thVoice:enVoice );
  if(!ok){ audioSay(pairs); return; }
  try{
    if(speechSynthesis.speaking||speechSynthesis.pending) speechSynthesis.cancel();
    let started=false;
    const us = pairs.map(([t,l])=>{
      const u=new SpeechSynthesisUtterance(t); u.lang = l.startsWith('th')?'th-TH':'en-US';
      u.rate=.86; u.pitch=1; u.volume=1; const v=l.startsWith('th')?thVoice:enVoice; if(v) u.voice=v; return u;
    });
    us[0].addEventListener('start',()=>{started=true;});
    us.forEach(u=>speechSynthesis.speak(u));
    if(!isIOS) setTimeout(()=>{ if(!started && !speechSynthesis.speaking && !speechSynthesis.pending) audioSay(pairs); },900);
  }catch(e){ audioSay(pairs); }
}
function speak(t,l){ say([[t, l||'th']]); }

let actx=null;
function beep(kind){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const seq = kind==='good' ? [[523,0],[659,.09],[784,.18],[1046,.27]]
             : kind==='bad'  ? [[320,0],[210,.14]]
             : kind==='win'  ? [[523,0],[659,.1],[784,.2],[1046,.3],[1318,.42]]
             : [[700,0]];
    seq.forEach(([f,t])=>{
      const o=actx.createOscillator(), g=actx.createGain();
      o.type='sine'; o.frequency.value=f; o.connect(g); g.connect(actx.destination);
      const s=actx.currentTime+t;
      g.gain.setValueAtTime(.0001,s); g.gain.exponentialRampToValueAtTime(.22,s+.02);
      g.gain.exponentialRampToValueAtTime(.0001,s+.26);
      o.start(s); o.stop(s+.28);
    });
  }catch(e){}
}
function haptic(ms){ try{ navigator.vibrate && navigator.vibrate(ms); }catch(e){} }
</script>

const ALL = [];
UNITS.forEach((u,ui)=> u.lessons.forEach((l,li)=> ALL.push({key:u.id+'-'+li, ui, li, unit:u, lesson:l}) ));
</script>

<script>
/* =====================================================================
   4. STATE
   ===================================================================== */
const HEART_MAX = 5, HEART_MS = 12*60*1000, DAILY_GOAL = 50;
const S = {
  xp:        store.get('xp', 0),
  streak:    store.get('streak', 0),
  lastDay:   store.get('lastDay', ''),
  hearts:    store.get('hearts', HEART_MAX),
  heartAt:   store.get('heartAt', 0),
  crowns:    store.get('crowns', {}),
  today:     store.get('today', ''),
  todayXP:   store.get('todayXP', 0),
  mistakes:  store.get('mistakes', []),
  lessons:   store.get('lessons', 0),
  bestCombo: store.get('bestCombo', 0),
  easy:      store.get('easy', true),
};
function save(){ ['xp','streak','lastDay','hearts','heartAt','crowns','today','todayXP','mistakes','lessons','bestCombo','easy']
  .forEach(k=>store.set(k, S[k])); }
function dayKey(d){ d=d||new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function yesterdayKey(){ const d=new Date(); d.setDate(d.getDate()-1); return dayKey(d); }

function rollDay(){
  const t = dayKey();
  if(S.today !== t){ S.today = t; S.todayXP = 0; }
  if(S.lastDay && S.lastDay !== t && S.lastDay !== yesterdayKey()) S.streak = 0;
  // เติมหัวใจตามเวลา
  if(S.hearts < HEART_MAX){
    if(!S.heartAt) S.heartAt = Date.now();
    const gained = Math.floor((Date.now() - S.heartAt) / HEART_MS);
    if(gained > 0){
      S.hearts = Math.min(HEART_MAX, S.hearts + gained);
      S.heartAt = (S.hearts >= HEART_MAX) ? 0 : S.heartAt + gained*HEART_MS;
    }
  } else S.heartAt = 0;
  save();
}
function markProgressToday(){
  const t = dayKey();
  if(S.lastDay !== t){ S.streak = (S.lastDay === yesterdayKey()) ? S.streak+1 : 1; S.lastDay = t; }
}
function addXP(n){ S.xp += n; S.todayXP += n; save(); paintStats(); }
function loseHeart(){
  if(S.hearts === HEART_MAX) S.heartAt = Date.now();
  S.hearts = Math.max(0, S.hearts-1); save(); paintStats();
}
function crownOf(key){ return S.crowns[key] || 0; }
function unlockedCount(){ let n=1; for(let i=0;i<ALL.length;i++){ if(crownOf(ALL[i].key)>0) n=i+2; } return Math.min(n, ALL.length); }

/* =====================================================================
   5. UTIL
   ===================================================================== */
const $ = s => document.querySelector(s);
function el(tag, cls, html){ const e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function esc(s){ return String(s).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function isThai(s){ return /[฀-๿]/.test(s); }
function langOf(s, fallback){ return fallback || (isThai(s) ? 'th' : 'en'); }

function confetti(){
  const box = $('#confetti');
  const cols = ['#C084FC','#FF7BC5','#7DD3FC','#6EE7B7','#FDE68A','#FDA4AF','#8B5CF6'];
  for(let i=0;i<70;i++){
    const c = el('div','cf');
    c.style.left = Math.random()*100+'%';
    c.style.top = '-20px';
    c.style.background = cols[i%cols.length];
    c.style.animationDuration = (1.6+Math.random()*1.4)+'s';
    c.style.animationDelay = (Math.random()*.5)+'s';
    box.appendChild(c);
    setTimeout(()=>c.remove(), 3600);
  }
}
function modal(emo, title, sub, okText, onOk, noText, onNo){
  $('#m-emo').textContent = emo; $('#m-title').textContent = title; $('#m-sub').innerHTML = sub;
  const ok = $('#m-ok'), no = $('#m-no');
  ok.textContent = okText;

  if(noText){ no.style.display='flex'; no.textContent=noText; no.onclick=()=>{ $('#modal').classList.remove('on'); onNo && onNo(); }; }
  else no.style.display='none';
  $('#modal').classList.add('on');
}

const NODE_ICONS = ['📘','⭐','🏅','👑'];

  const left = DAILY_GOAL - S.todayXP;
  hero.innerHTML = '<div class="owl">🦉</div><div><div class="ht">'+

          +'inset 0 -6px 10px rgba(0,0,0,.16),inset 0 6px 10px rgba(255,255,255,.45)'; }

function openLessonIntro(idx){

/* =====================================================================
   8. LESSON ENGINE
   ===================================================================== */
let L = null;

function startLesson(idx, practice){
  if(S.hearts <= 0 && !practice){ heartsOut(); return; }
  const src = practice ? practice : shuffle(ALL[idx].lesson.ex).slice(0, 12);
  L = {
    idx, practice: !!practice,
    queue: src.map(prep),
    total: src.length, pos: 0, right: 0, wrong: 0,
    combo: 0, maxCombo: 0, xp: 0, retry: [], missed: []
  };
  $('#lesson').classList.add('on');
  paintStats();
  nextEx();
}
function prep(ex){
  const e = JSON.parse(JSON.stringify(ex));
  if(e.t==='ch' || e.t==='listen'){
    const correct = (e.t==='listen') ? e.a : e.opts[e.a];
    const opts = shuffle(e.opts);
    e._opts = opts; e._ans = correct; e._ai = opts.indexOf(correct);
  }
  if(e.t==='grid'){ const correct = e.opts[e.a]; const opts = shuffle(e.opts); e._opts=opts; e._ans=correct; e._ai=opts.indexOf(correct); }
  if(e.t==='build'){ e._bankFull = shuffle(e.tokens.concat(e.extra||[])); e._bankEasy = shuffle(e.tokens); }
  if(e.t==='match'){ e._left = shuffle(e.pairs.map(p=>p[0])); e._right = shuffle(e.pairs.map(p=>p[1])); }
  return e;
}

let picked = null, checked = false, buildSeq = [], buildWrong = 0, matchLeft = null, matchOK = 0, matchErr = false;

function nextEx(){
  if(L.pos >= L.queue.length){
    if(L.retry.length){ L.queue = L.queue.concat(L.retry); L.retry = []; nextEx(); return; }
    finishLesson(); return;
  }
  picked = null; checked = false; buildSeq = []; buildWrong = 0; matchLeft = null; matchOK = 0; matchErr = false;
  const ex = L.queue[L.pos];
  const bar = Math.round(100 * L.pos / Math.max(L.total, L.queue.length));
  $('#l-bar').style.width = bar+'%';
  $('#l-foot').className = 'lfoot';
  $('#l-fb').innerHTML = '';
  const btn = $('#l-btn'); btn.className='btn'; btn.textContent='ตรวจคำตอบ'; btn.disabled = true;
  btn.onclick = onCheck;
  $('#l-combo').textContent = L.combo>=3 ? ('🔥 ตอบถูกติดกัน '+L.combo+' ข้อ!') : '';
  drawEx(ex);
  document.querySelector('.lbody').scrollTop = 0;
}

function drawEx(ex){
  const b = $('#l-body'); b.innerHTML='';
  if(ex.passage){
    const p = el('div','passage');
    p.innerHTML = '<h4>'+esc(ex.passage.title)+'</h4>'+esc(ex.passage.text).replace(/\n/g,'<br>');
    const sp = el('button','speaker sm','🔊'); sp.style.marginTop='10px';
    sp.onclick = ()=> speak(ex.passage.text.replace(/\n/g,' '), 'th');
    p.appendChild(sp);
    b.appendChild(p);
  }

  if(ex.t==='ch' || ex.t==='grid'){
    b.appendChild(el('div','qtitle', esc(ex.q)));
    if(ex.emo) b.appendChild(el('div','bigemo', ex.emo));
    if(ex.say){
      const pr = el('div','prompt');
      const sp = el('button','speaker','🔊'); sp.onclick = ()=> speak(ex.say[0], ex.say[1]);
      const bu = el('div','bubble', esc(ex.say[0]));
      pr.appendChild(sp); pr.appendChild(bu); b.appendChild(pr);
    }
  }

  if(ex.t==='ch'){
    const box = el('div','opts');
    ex._opts.forEach((o,i)=>{
      const o2 = el('button','opt');
      o2.innerHTML = '<span class="key">'+(i+1)+'</span><span>'+esc(o)+'</span>';
      o2.onclick = ()=>{ if(checked) return; picked=i; beep('tap');
        speak(o, langOf(o, ex.lang));
        box.querySelectorAll('.opt').forEach((x,j)=>x.classList.toggle('sel', j===i));
        $('#l-btn').disabled=false; };
      box.appendChild(o2);
    });
    b.appendChild(box);
  }

  if(ex.t==='grid'){
    const g = el('div','grid');
    ex._opts.forEach((o,i)=>{
      const c = el('button','card');
      c.innerHTML = '<div class="e">'+o.e+'</div>'+(o.t?'<div class="t">'+esc(o.t)+'</div>':'');
      c.onclick = ()=>{ if(checked) return; picked=i; beep('tap');
        g.querySelectorAll('.card').forEach((x,j)=>x.classList.toggle('sel', j===i));
        $('#l-btn').disabled=false; };
      g.appendChild(c);
    });
    b.appendChild(g);
  }

  if(ex.t==='listen'){
    b.appendChild(el('div','qtitle','ฟังแล้วเลือกคำที่ได้ยิน'));
    const pr = el('div','prompt');
    const sp = el('button','speaker','🔊'); sp.onclick = ()=> speak(ex.a, ex.lang);
    const sl = el('button','speaker sm','🔁'); sl.style.background='var(--g-pink)'; sl.style.boxShadow='0 6px 0 var(--pink-d),0 14px 20px -10px rgba(236,72,153,.6),inset 0 -4px 7px rgba(0,0,0,.14),inset 0 4px 7px rgba(255,255,255,.45)';
    sl.onclick = ()=>{ speak(ex.a, ex.lang); };
    pr.appendChild(sp); pr.appendChild(sl); b.appendChild(pr);
    setTimeout(()=>speak(ex.a, ex.lang), 350);
    const box = el('div','opts');
    ex._opts.forEach((o,i)=>{
      const o2 = el('button','opt');
      o2.innerHTML = '<span class="key">'+(i+1)+'</span><span>'+esc(o)+'</span>';
      o2.onclick = ()=>{ if(checked) return; picked=i;
        box.querySelectorAll('.opt').forEach((x,j)=>x.classList.toggle('sel', j===i));
        $('#l-btn').disabled=false; };
      box.appendChild(o2);
    });
    b.appendChild(box);
  }

  if(ex.t==='build'){
    const joiner = ex.lang==='en' ? ' ' : '';
    ex._joiner = joiner;
    const target = ex.tokens.join(joiner);
    b.appendChild(el('div','qtitle', esc(ex.q)));

    if(S.easy){
      /* โหมดง่าย: เห็นประโยคตัวอย่าง + แตะเรียงตามทีละคำ แตะผิดไม่เสียหัวใจ */
      const pr = el('div','prompt');
      const sp = el('button','speaker','🔊'); sp.onclick = ()=> speak(target, ex.lang);
      const bu = el('div','bubble', esc(target));
      pr.appendChild(sp); pr.appendChild(bu); b.appendChild(pr);
      setTimeout(()=> speak(target, ex.lang), 320);
      b.appendChild(el('div','qsub','แตะคำด้านล่างเรียงตามประโยคข้างบน ทีละคำ · แตะผิดไม่เสียหัวใจนะ'));
    }else{
      b.appendChild(el('div','qsub','แตะคำด้านล่างเรียงให้เป็นประโยค · แตะคำที่วางแล้วเพื่อเอาออก'));
    }

    const bankSrc = S.easy ? ex._bankEasy : ex._bankFull;
    const ansLine = el('div','answerline');
    const bank = el('div','bank');
    const redraw = ()=>{
      ansLine.innerHTML=''; bank.innerHTML='';
      buildSeq.forEach((tok,i)=>{
        const c = el('button','chip done', esc(tok));
        c.onclick = ()=>{
          if(checked) return;
          if(S.easy && i !== buildSeq.length-1) return;   /* โหมดง่าย เอาออกได้เฉพาะคำล่าสุด */
          buildSeq.splice(i,1); redraw();
        };
        ansLine.appendChild(c);
      });
      if(S.easy){
        for(let k=buildSeq.length; k<ex.tokens.length; k++){
          const sl = el('div','slot'+(k===buildSeq.length?' next':''),'');
          sl.style.width = Math.max(44, ex.tokens[k].length*13 + 22)+'px';
          ansLine.appendChild(sl);
        }
      }
      bankSrc.forEach((tok,i)=>{
        const used = countIn(buildSeq,tok) >= countIn(bankSrc.slice(0,i+1), tok);
        const isNext = S.easy && tok === ex.tokens[buildSeq.length];
        const c = el('button','chip'+(used?' used':'')+((!used && isNext && buildWrong>=2)?' hint':''), esc(tok));
        c.onclick = ()=>{
          if(checked || used) return;
          if(S.easy && !isNext){
            buildWrong++; beep('bad'); haptic(40);
            c.classList.add('wrong');
            setTimeout(()=>{ c.classList.remove('wrong'); if(buildWrong>=2) redraw(); }, 420);
            return;
          }
          buildSeq.push(tok); beep('tap'); speak(tok, ex.lang); redraw();
          if(S.easy && buildSeq.length===ex.tokens.length){
            $('#l-btn').disabled = false;
            const posNow = L.pos;
            setTimeout(()=>{ if(L && !checked && L.pos===posNow && L.queue[L.pos]===ex) onCheck(); }, 280);
          }
        };
        bank.appendChild(c);
      });
      $('#l-btn').disabled = S.easy ? (buildSeq.length !== ex.tokens.length) : (buildSeq.length === 0);
    };
    b.appendChild(ansLine); b.appendChild(bank);
    redraw();
  }

  if(ex.t==='match'){
    b.appendChild(el('div','qtitle', esc(ex.q)));
    b.appendChild(el('div','qsub','แตะฝั่งซ้าย แล้วแตะคู่ของมันฝั่งขวา'));
    const cols = el('div','matchcols');
    const lc = el('div'), rc = el('div');
    lc.style.cssText = rc.style.cssText = 'display:flex;flex-direction:column;gap:11px;';
    const map = {}; ex.pairs.forEach(p=> map[p[0]] = p[1]);
    ex._left.forEach(v=>{
      const t = el('button','mtile', esc(v));
      t.onclick = ()=>{
        if(t.classList.contains('ok')) return;
        lc.querySelectorAll('.mtile').forEach(x=>x.classList.remove('sel'));
        t.classList.add('sel'); matchLeft = {v, node:t}; speak(v, langOf(v, ex.lang));
      };
      lc.appendChild(t);
    });
    ex._right.forEach(v=>{
      const t = el('button','mtile', esc(v));
      t.onclick = ()=>{
        if(!matchLeft || t.classList.contains('ok')) return;
        if(map[matchLeft.v] === v){
          matchLeft.node.classList.remove('sel'); matchLeft.node.classList.add('ok');
          t.classList.add('ok'); matchOK++; beep('tap'); matchLeft=null;
          if(matchOK === ex.pairs.length){ $('#l-btn').disabled=false; onCheck(); }
        }else{
          matchErr = true; t.classList.add('err'); beep('bad'); haptic(60);
          const n = matchLeft.node;
          setTimeout(()=>{ t.classList.remove('err'); n.classList.remove('sel'); }, 500);
          matchLeft = null;
        }
      };
      rc.appendChild(t);
    });
    cols.appendChild(lc); cols.appendChild(rc);
    b.appendChild(cols);
  }
}
function countIn(arr, v){ return arr.filter(x=>x===v).length; }

function onCheck(){
  const ex = L.queue[L.pos];
  if(checked){ L.pos++; nextEx(); return; }
  checked = true;
  let ok = false, answerText = '';

  if(ex.t==='ch' || ex.t==='listen' || ex.t==='grid'){
    ok = (picked === ex._ai);
    answerText = (ex.t==='grid') ? (ex._ans.t || '') : ex._ans;
    const sel = document.querySelectorAll(ex.t==='grid' ? '.card' : '.opt');
    sel.forEach((x,i)=>{
      if(i===ex._ai) x.classList.add('good');
      else if(i===picked) x.classList.add('bad');
      else x.classList.add('dim');
    });
    if(ex.t!=='grid') speak(ex._ans, ex.lang || langOf(ex._ans));
  }
  if(ex.t==='build'){
    ok = buildSeq.length===ex.tokens.length && buildSeq.every((t,i)=>t===ex.tokens[i]);
    answerText = ex.tokens.join(ex._joiner);
    if(ok) speak(answerText, ex.lang);
  }
  if(ex.t==='match'){
    ok = !matchErr;
    answerText = 'จับคู่ครบแล้ว';
  }

  const btn = $('#l-btn'); btn.disabled=false; btn.textContent='ไปต่อ';
  const foot = $('#l-foot'); const fb = $('#l-fb');
  if(ok){
    L.right++; L.combo++; L.maxCombo = Math.max(L.maxCombo, L.combo);
    let gain = L.practice ? 5 : 10;
    if(L.combo>0 && L.combo%5===0) gain += 5;
    L.xp += gain;
    beep('good'); haptic(25); confettiSmall();
    foot.classList.add('good'); btn.className='btn green';
    fb.innerHTML = '<div class="fb"><div class="fi">🎉</div><div><div class="ft">'+
      pickPraise()+'</div>'+(ex.sub?'<div class="fs">'+esc(ex.sub)+'</div>':'')+
      '<div class="fs">+'+gain+' XP</div></div></div>';
  }else{
    L.wrong++; L.combo = 0;
    if(!L.practice) loseHeart();
    L.retry.push(ex);
    L.missed.push(exSignature(ex));
    beep('bad'); haptic([40,60,40]);
    foot.classList.add('bad'); btn.className='btn red';
    fb.innerHTML = '<div class="fb"><div class="fi">💡</div><div><div class="ft">คำตอบที่ถูกคือ '+esc(answerText)+'</div>'+
      (ex.sub?'<div class="fs">'+esc(ex.sub)+'</div>':'<div class="fs">ไม่เป็นไร เดี๋ยวเจอข้อนี้อีกครั้งนะ</div>')+'</div></div>';
    if(S.hearts<=0 && !L.practice){ setTimeout(heartsOut, 700); }
  }
  $('#l-combo').textContent = L.combo>=3 ? ('🔥 ตอบถูกติดกัน '+L.combo+' ข้อ!') : '';
  paintStats();
}
const PRAISE = ['เก่งมาก!','ถูกต้อง!','สุดยอด!','เยี่ยม!','ดีมาก!','ใช่เลย!','เจ๋ง!'];
function pickPraise(){ return PRAISE[Math.floor(Math.random()*PRAISE.length)]; }
function exSignature(ex){ return ex.q || ex.a || (ex.tokens&&ex.tokens.join(' ')) || 'ex'; }
function confettiSmall(){
  const box = $('#confetti'); const cols=['#C084FC','#FF7BC5','#FDE68A'];
  for(let i=0;i<14;i++){ const c=el('div','cf'); c.style.left=(35+Math.random()*30)+'%'; c.style.top='55%';
    c.style.background=cols[i%3]; c.style.animationDuration=(.9+Math.random()*.5)+'s'; box.appendChild(c);
    setTimeout(()=>c.remove(),1500); }
}

function heartsOut(){
  modal('💔','หัวใจหมดแล้ว',
    'พักก่อนนะ หัวใจจะเติมเองทีละดวงทุก 12 นาที<br>หรือจะ<b>ฝึกซ้ำ</b>เพื่อเติมหัวใจให้เต็มก็ได้',
    'ฝึกซ้ำเติมหัวใจ', ()=>{ closeLesson(true); startPractice(true); },
    'ออกก่อน', ()=>closeLesson(true));
}

function finishLesson(){
  const acc = L.total ? Math.round(100*L.right/(L.right+L.wrong)) : 0;
  let bonus = 20;
  if(L.wrong===0) bonus += 10;
  L.xp += bonus;
  addXP(L.xp);
  markProgressToday();
  S.lessons++;
  S.bestCombo = Math.max(S.bestCombo, L.maxCombo);

  if(L.refillHearts){ S.hearts = HEART_MAX; S.heartAt = 0; }

  if(!L.practice){
    const key = ALL[L.idx].key;
    S.crowns[key] = Math.min(3, crownOf(key) + 1);
    // เก็บข้อที่ผิดไว้ฝึกซ้ำ
    if(L.missed.length){
      const store2 = S.mistakes.concat(ALL[L.idx].lesson.ex.filter(e=>L.missed.indexOf(exSignature(e))>=0));
      S.mistakes = store2.slice(-40);
    }
  }
  save(); paintStats();

  $('#lesson').classList.remove('on');
  $('#r-emo').textContent = L.wrong===0 ? '🏆' : (acc>=70 ? '🎉' : '💪');
  $('#r-title').textContent = L.wrong===0 ? 'เพอร์เฟกต์!' : (acc>=70 ? 'เยี่ยมมาก!' : 'ทำได้ดีแล้ว!');
  $('#r-sub').textContent = L.practice ? 'ฝึกซ้ำสำเร็จ' + (L.refillHearts?' · หัวใจเต็มแล้ว ❤️':'')
                                       : ALL[L.idx].unit.name + ' · ' + ALL[L.idx].lesson.n;
  $('#r-xp').textContent = '+'+L.xp;
  $('#r-acc').textContent = acc+'%';
  $('#r-combo').textContent = L.maxCombo;
  $('#result').classList.add('on');
  beep('win'); confetti();
  $('#r-btn').onclick = ()=>{ $('#result').classList.remove('on'); paintPath(); paintReview(); paintMe(); checkBadges(); };
}
function closeLesson(force){
  if(!force && L && L.pos>0){
    modal('🤔','ออกจากบทเรียน?','ความคืบหน้าในบทนี้จะหายไปนะ','ออกเลย', ()=>closeLesson(true), 'เรียนต่อ');
    return;
  }
  $('#lesson').classList.remove('on'); L=null; paintPath(); paintStats();
}
$('#l-x').onclick = ()=>closeLesson(false);

/* =====================================================================
   9. PRACTICE (ฝึกซ้ำ)
   ===================================================================== */
function poolRandom(n){
  const pool = [];
  ALL.forEach(a=>{ if(crownOf(a.key)>0) a.lesson.ex.forEach(e=>pool.push(e)); });
  if(!pool.length) ALL[0].lesson.ex.forEach(e=>pool.push(e));
  return shuffle(pool).slice(0,n);
}
function startPractice(refill){
  let set = S.mistakes.length ? shuffle(S.mistakes).slice(0,8) : [];
  if(set.length < 8) set = set.concat(poolRandom(8-set.length));
  startLesson(-1, set);
  L.refillHearts = !!refill;
  if(refill) $('#l-combo').textContent = '❤️ ทำให้ครบเพื่อเติมหัวใจ!';
}
function paintReview(){
  const b = $('#review'); b.innerHTML='';
  b.appendChild(el('div','h2','🎯 ฝึกซ้ำ'));
  const t1 = el('div','tile');
  t1.innerHTML = '<div class="tt">ทบทวนข้อที่เคยตอบผิด</div><div class="ts">ตอนนี้มี '+S.mistakes.length+' ข้อรอทบทวน · ฝึกซ้ำไม่เสียหัวใจ ได้ 5 XP ต่อข้อ</div>';
  const btn = el('button','btn blue','เริ่มฝึกซ้ำ 8 ข้อ'); btn.style.marginTop='12px';
  btn.onclick = ()=>startPractice(false);
  t1.appendChild(btn); b.appendChild(t1);

  const t2 = el('div','tile');
  t2.innerHTML = '<div class="tt">❤️ เติมหัวใจ</div><div class="ts">หัวใจตอนนี้ '+S.hearts+'/'+HEART_MAX+
    (S.hearts<HEART_MAX ? ' · ดวงถัดไปอีก '+nextHeartMin()+' นาที' : ' · เต็มแล้ว')+'</div>';
  if(S.hearts < HEART_MAX){
    const b2 = el('button','btn','ฝึกซ้ำเพื่อเติมหัวใจให้เต็ม'); b2.style.marginTop='12px';
    b2.onclick = ()=>startPractice(true); t2.appendChild(b2);
  }
  b.appendChild(t2);

  b.appendChild(el('div','h2','📋 บทเรียนทั้งหมด'));
  UNITS.forEach((u,ui)=>{
    u.lessons.forEach((l,li)=>{
      const key = u.id+'-'+li, cr = crownOf(key);
      const idx = ALL.findIndex(a=>a.key===key);
      const t = el('div','tile');
      t.style.opacity = idx>=unlockedCount() ? .5 : 1;
      t.innerHTML = '<div class="tt">'+u.icon+' '+esc(l.n)+'</div><div class="ts">หน่วยที่ '+(ui+1)+' · '+
        l.ex.length+' ข้อ · '+(cr>0?('👑 '+cr+'/3'):(idx>=unlockedCount()?'🔒 ยังไม่เปิด':'ยังไม่เริ่ม'))+'</div>';
      if(idx < unlockedCount()) t.onclick = ()=>openLessonIntro(idx);
      b.appendChild(t);
    });
  });
}
function nextHeartMin(){
  if(S.hearts>=HEART_MAX || !S.heartAt) return 0;
  return Math.max(1, Math.ceil((HEART_MS - (Date.now()-S.heartAt))/60000));
}

/* =====================================================================
   10. PROFILE
   ===================================================================== */
const BADGES = [
  {e:'🌱', n:'ก้าวแรก',      d:'จบ 1 บท',        ok:()=>S.lessons>=1},
  {e:'🔥', n:'ไฟ 3 วัน',     d:'streak 3 วัน',   ok:()=>S.streak>=3},
  {e:'🔥', n:'ไฟ 7 วัน',     d:'streak 7 วัน',   ok:()=>S.streak>=7},
  {e:'⚡', n:'100 XP',       d:'สะสม 100 XP',    ok:()=>S.xp>=100},
  {e:'💫', n:'500 XP',       d:'สะสม 500 XP',    ok:()=>S.xp>=500},
  {e:'🎯', n:'คอมโบ 10',     d:'ตอบถูกติดกัน 10',ok:()=>S.bestCombo>=10},
  {e:'👑', n:'นักสะสมมงกุฎ', d:'ได้ 10 มงกุฎ',   ok:()=>Object.values(S.crowns).reduce((a,b)=>a+b,0)>=10},
  {e:'📖', n:'นักอ่าน',      d:'จบหน่วยอ่านเรื่อง',ok:()=>UNITS[3].lessons.every((l,i)=>crownOf('u4-'+i)>0)},
  {e:'🏆', n:'จบทุกหน่วย',   d:'เปิดครบทุกบท',   ok:()=>ALL.every(a=>crownOf(a.key)>0)},
];
function paintMe(){
  const b = $('#me'); b.innerHTML='';
  b.appendChild(el('div','h2','🦉 ของฉัน'));
  const g = el('div','statgrid');
  const crownTotal = Object.values(S.crowns).reduce((a,x)=>a+x,0);
  [['🔥',S.streak+' วัน','สถิติต่อเนื่อง'],['⚡',S.xp+' XP','คะแนนรวม'],
   ['👑',crownTotal,'มงกุฎที่ได้'],['📘',S.lessons,'บทที่เรียนจบ'],
   ['🎯',S.bestCombo,'คอมโบสูงสุด'],['❤️',S.hearts+'/'+HEART_MAX,'หัวใจ']]
  .forEach(([e,v,l])=>{
    const s = el('div','sbox');
    s.innerHTML = '<div class="se">'+e+'</div><div><div class="sv">'+v+'</div><div class="sl">'+l+'</div></div>';
    g.appendChild(s);
  });
  b.appendChild(g);

  b.appendChild(el('div','h2','⚙️ ตั้งค่า'));
  const setT = el('div','tile');
  setT.innerHTML = '<div class="tt">🧩 โหมดง่าย · ข้อเรียงประโยค</div>'+
    '<div class="ts">เปิดไว้ = เห็นประโยคตัวอย่าง มีช่องบอกจำนวนคำ กดฟังเสียงได้ '+
    'แตะผิดแค่สั่นเตือน ไม่เสียหัวใจ และถ้าแตะผิด 2 ครั้งจะไฮไลต์คำที่ถูกให้<br>ตอนนี้: <b>'+
    (S.easy?'เปิดอยู่':'ปิดอยู่')+'</b></div>';
  const tg = el('button','btn'+(S.easy?' ghost':''), S.easy?'ปิดโหมดง่าย (ให้ท้าทายขึ้น)':'เปิดโหมดง่าย');
  tg.style.marginTop='12px';
  tg.onclick = ()=>{ S.easy = !S.easy; save(); paintMe(); };
  setT.appendChild(tg); b.appendChild(setT);

  b.appendChild(el('div','h2','🏅 เหรียญรางวัล'));
  const bs = el('div','badges');
  BADGES.forEach(x=>{
    const d = el('div','badge'+(x.ok()?' on':''));
    d.innerHTML = '<div class="be">'+x.e+'</div><div class="bn">'+x.n+'</div><div class="bd">'+x.d+'</div>';
    bs.appendChild(d);
  });
  b.appendChild(bs);

  b.appendChild(el('div','h2','📚 ที่มาของเนื้อหา'));
  const src = el('div','tile');
  src.innerHTML = '<div class="ts">สมุดอ่านทบทวน (สัปดาห์ที่ 7 และ 9) · แบบฝึกหัดภาษาไทย ป.1 เรื่องวรรณยุกต์ เอก โท (หน้า 26–44) · แบบหัดอ่านภาษาไทย เล่ม 3 (บทที่ 15, 17, 19, 20) · ใบงาน ILEP Worksheet โรงเรียนบูรณะศึกษา</div>';
  b.appendChild(src);

  const rst = el('button','btn ghost','ล้างความคืบหน้าทั้งหมด');
  rst.style.marginTop='16px';
  rst.onclick = ()=> modal('⚠️','ล้างความคืบหน้า?','XP มงกุฎ และ streak ทั้งหมดจะหายไป','ล้างเลย',()=>{
    ['xp','streak','lastDay','hearts','heartAt','crowns','today','todayXP','mistakes','lessons','bestCombo'].forEach(k=>{
      try{ localStorage.removeItem('duokid_'+k); }catch(e){} delete MEM[k];
    });
    location.reload();
  },'ไม่ล้าง');
  b.appendChild(rst);
}
let shownBadges = store.get('shownBadges', []);
function checkBadges(){
  const fresh = BADGES.filter(x=> x.ok() && shownBadges.indexOf(x.n)<0 );
  if(!fresh.length) return;
  fresh.forEach(x=> shownBadges.push(x.n) );
  store.set('shownBadges', shownBadges);
  let i = 0;
  const showNext = ()=>{
    if(i >= fresh.length){ paintMe(); return; }
    const x = fresh[i++];
    setTimeout(()=> modal(x.e, 'ได้เหรียญใหม่!', '<b>'+x.n+'</b><br>'+x.d, 'เย้!', showNext), 350);
  };
  showNext();
}

/* =====================================================================
   11. NAV + BOOT
   ===================================================================== */
document.querySelectorAll('.navb').forEach(btn=>{
  btn.onclick = ()=>{
    document.querySelectorAll('.navb').forEach(x=>x.classList.remove('on'));
    btn.classList.add('on');
    const go = btn.dataset.go;
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
    $('#sc-'+go).classList.add('on');
    if(go==='review') paintReview();
    if(go==='me') paintMe();
    window.scrollTo(0,0);
  };
});
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden){ rollDay(); paintStats(); } });
document.addEventListener('click', function warm(){
  try{ if(hasTTS){ const u=new SpeechSynthesisUtterance(' '); u.volume=0; speechSynthesis.speak(u);} }catch(e){}
  try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
  document.removeEventListener('click', warm);
}, {once:false});

rollDay();
paintDeco();
paintStats();
paintPath();
paintReview();
paintMe();
setInterval(()=>{ rollDay(); paintStats(); }, 60000);
</script>
